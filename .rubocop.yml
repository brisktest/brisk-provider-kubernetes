AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

require:
  - rubocop-rspec
  - rubocop-rspec_rails

plugins:
  - rubocop-factory_bot

# Disable some stricter RSpec cops
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

RSpec/MessageSpies:
  Enabled: false

RSpec/IndexedLet:
  Enabled: false

# Disable strict metrics cops
Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

# Allow file names with hyphens for gems
Naming/FileName:
  Enabled: false

# Allow development dependencies in gemspec
Gemspec/DevelopmentDependencies:
  Enabled: false

# Disable buggy Capybara cop
Capybara/RSpec/PredicateMatcher:
  Enabled: false
